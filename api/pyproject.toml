[project]
name = "emt-api"
version = "0.1.0"
description = "FastAPI replacement for the APEX application tier of an EMT-style dashboard; Oracle stays."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "oracledb>=2.4,<4",
    "pydantic>=2.8,<3",
    "PyJWT>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Query() defaults are the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
