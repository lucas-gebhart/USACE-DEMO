server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the api service at request time so nginx starts even if the API is still waiting on Oracle.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    try_files $uri /index.html;
  }
}
